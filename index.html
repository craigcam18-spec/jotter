<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jotter Planner</title>
<meta name="description" content="A lesson planner for a primary teacher: timetable, lessons, and a day-disrupted button.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jotter">
<meta name="theme-color" content="#1f5c99">
<!--PREVIEW-START-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a jotter on the desk. App bar on top, the day or week as the page, the lesson opens as a ruled jotter sheet with a red margin. */
:root{
  --paper:#f3f6f8; --surface:#ffffff; --sunk:#e9eef2;
  --ink:#1b2830; --muted:#5a6a75; --line:#d5dde3;
  --accent:#1f5c99; --accent-ink:#ffffff; --accent-soft:#e1ecf8;
  --mark:#ffe680; --margin:#d9463f; --rule:#dbe6f1;
  --ok:#2f7d4f; --warn:#a15c00;
  --chipL:89%; --chipS:62%; --stripeL:68%;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11171c; --surface:#19222a; --sunk:#0d1216;
  --ink:#e5ecf0; --muted:#95a5b0; --line:#2a3741;
  --accent:#86b6ea; --accent-ink:#0d1a27; --accent-soft:#1c2e41;
  --mark:#5a4b0e; --margin:#e0716b; --rule:#22303b;
  --ok:#7fcf9c; --warn:#f0b35c;
  --chipL:27%; --chipS:40%; --stripeL:58%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#11171c; --surface:#19222a; --sunk:#0d1216;
  --ink:#e5ecf0; --muted:#95a5b0; --line:#2a3741;
  --accent:#86b6ea; --accent-ink:#0d1a27; --accent-soft:#1c2e41;
  --mark:#5a4b0e; --margin:#e0716b; --rule:#22303b;
  --ok:#7fcf9c; --warn:#f0b35c;
  --chipL:27%; --chipS:40%; --stripeL:58%; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3.5vw,2.2rem)}
h2{font-size:1.25rem}
h3{font-size:1.02rem}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted)}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav button:hover:not([aria-current="page"]){background:var(--sunk);color:var(--ink)}
.sync{margin-left:auto;font-size:.82rem;display:flex;align-items:center;gap:6px;color:var(--muted);border:0;background:none;cursor:pointer;padding:6px 8px;border-radius:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="ok"] i{background:var(--ok)}
.sync[data-s="syncing"] i{background:var(--accent)}
.sync[data-s="error"] i,.sync[data-s="offline"] i{background:var(--warn)}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head .sub{margin-top:4px}
.navbtns{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--margin)}
.btn.sm{padding:5px 10px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.stack{display:grid;gap:16px}

/* subject chip */
.chip{--h:210;display:inline-flex;align-items:center;gap:6px;background:hsl(var(--h) var(--chipS) var(--chipL));color:var(--ink);padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.chip.none{background:var(--sunk);color:var(--muted)}

/* day list */
.day{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-left:6px solid hsl(var(--h,210) 55% var(--stripeL))}
.slot.now{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.slot .time{font-family:var(--mono);font-size:.85rem;color:var(--muted);line-height:1.3}
.slot .open{all:unset;cursor:pointer;display:grid;gap:3px;min-width:0}
.slot .open:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:4px}
.slot .title{font-weight:700;font-size:1.05rem}
.slot .title.empty{color:var(--accent);font-weight:700}
.slot .li{color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.brk{background:none;border-style:dashed;border-left-width:1px;padding-block:6px;grid-template-columns:92px 1fr}
.slot.brk .open{cursor:default}
.nowtag{background:var(--mark);color:var(--ink);font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:4px;letter-spacing:.06em;text-transform:uppercase}
.tick{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:transparent}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tick svg{width:18px;height:18px}
@media (max-width:520px){.slot{grid-template-columns:minmax(0,1fr) auto}.slot .time{grid-column:1/-1}.slot.brk{grid-template-columns:auto 1fr}.slot.brk .time{grid-column:auto}}

.stat{display:flex;gap:18px}
.stat b{display:block;font-family:var(--display);font-size:1.8rem;line-height:1}
.gaps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.gaps button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;width:100%;padding:6px 8px;border-radius:6px;box-sizing:border-box}
.gaps button:hover,.gaps button:focus-visible{background:var(--sunk)}
.gaps .d{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:78px}
.disrupt{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.disrupt label{display:flex;gap:8px;align-items:center;font-size:.95rem}
.disrupt label.off{color:var(--muted)}

.closed{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center}

/* week grid */
.wk{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.wk table{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed}
.wk th,.wk td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
.wk th:last-child,.wk td:last-child{border-right:0}
.wk thead th{background:var(--sunk);font-size:.85rem}
.wk thead th.today{background:var(--mark)}
.wk th.rowh{width:120px;font-weight:400}
.wk .rowh b{display:block;font-size:.85rem}
.wk .rowh span{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.wk tr.brk td,.wk tr.brk th{background:var(--sunk);padding-block:3px;font-size:.78rem;color:var(--muted)}
.cell{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:4px;width:100%;min-height:64px;padding:6px;border-radius:6px;background:hsl(var(--h,210) var(--chipS) var(--chipL) / .45)}
.cell:hover,.cell:focus-visible{outline:2px solid var(--accent)}
.cell .t{font-weight:700;font-size:.86rem;line-height:1.3;overflow-wrap:anywhere}
.cell .t.empty{color:var(--accent);font-weight:400}
.cell .s{font-size:.72rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.cell.done .t::before{content:"✓ ";color:var(--ok)}
.cell.hol{background:var(--sunk);cursor:default}
.holtag{display:block;font-weight:400;font-size:.72rem;color:var(--warn)}

/* subject run */
.run{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.run .r{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.run .r:last-child{border-bottom:0}
.run .r.wkstart{border-top:3px solid var(--sunk)}
.run .dt{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.run .open{all:unset;cursor:pointer;min-width:0}
.run .open:focus-visible{outline:3px solid var(--accent);border-radius:4px}
.run .done{color:var(--ok);font-weight:700;font-size:.82rem}
.run .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.run .r{grid-template-columns:minmax(0,1fr)}.run .acts{justify-content:flex-start}}
.subjpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subjpick button{all:unset;cursor:pointer;border-radius:999px}
.subjpick button[aria-pressed="true"] .chip{outline:2px solid var(--ink)}
.subjpick button:focus-visible{outline:3px solid var(--accent)}

/* setup */
.setup section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.setup{display:grid;gap:20px}
.tt{overflow-x:auto}
.tt table{border-collapse:collapse;min-width:820px;width:100%}
.tt th,.tt td{padding:4px;text-align:left;font-size:.9rem}
.tt thead th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=time],input[type=date],input[type=email],input[type=password],input[type=url],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
input[type=time]{min-width:92px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.subjrow{display:grid;grid-template-columns:minmax(0,1fr) 140px auto auto;gap:8px;align-items:center}
@media (max-width:520px){.subjrow{grid-template-columns:minmax(0,1fr) auto}}
.holrow{display:grid;grid-template-columns:minmax(0,1.4fr) 1fr 1fr auto;gap:8px;align-items:center}
@media (max-width:620px){.holrow{grid-template-columns:1fr 1fr}}
.note{font-size:.9rem;color:var(--muted);max-width:65ch}
.example{background:var(--mark);color:var(--ink);padding:10px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* lesson sheet */
.scrim{position:fixed;inset:0;background:rgb(10 20 30 / .4);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(640px,100%);height:100%;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgb(0 0 0 / .15)}
.sheet-h{position:sticky;top:0;background:var(--surface);z-index:1;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.sheet-h .row{justify-content:space-between}
.jot{flex:1;padding:18px 16px 30px 44px;position:relative;display:grid;gap:14px;align-content:start;
  background-image:linear-gradient(to right,transparent 30px,var(--margin) 30px,var(--margin) 32px,transparent 32px),
  repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px)}
.jot label{display:grid;gap:4px}
.jot textarea,.jot input{background:color-mix(in srgb,var(--surface) 85%,transparent)}
.jot textarea{resize:vertical;min-height:64px;line-height:1.5}
#ed-title{font-family:var(--display);font-size:1.3rem;font-weight:700;padding:8px 10px}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links a{font-size:.85rem;color:var(--accent);overflow-wrap:anywhere}
.sheet-f{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:30;font-weight:700;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.6}}}
</style>
<!--PREVIEW-END-->
</head>
<body>
<!--BODY-START-->
<header class="bar"><div class="bar-in">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="3" width="24" height="26" rx="3" fill="var(--accent)"/><rect x="9" y="3" width="1.6" height="26" fill="var(--margin)"/><rect x="13" y="10" width="11" height="2" rx="1" fill="var(--accent-ink)"/><rect x="13" y="15" width="11" height="2" rx="1" fill="var(--accent-ink)"/><rect x="13" y="20" width="7" height="2" rx="1" fill="var(--accent-ink)"/></svg>Jotter</div>
  <nav aria-label="Views">
    <button data-act="view" data-v="today">Today</button>
    <button data-act="view" data-v="week">Week</button>
    <button data-act="view" data-v="subjects">Subjects</button>
    <button data-act="view" data-v="setup">Setup</button>
  </nav>
  <button class="sync" id="sync" data-act="view" data-v="setup" data-s="local"><i></i><span>Saved on this device</span></button>
</div></header>
<main id="view"></main>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" hidden></div>
<!--BODY-END-->
<script>
/* ============ Sync settings (fill these in once, see README) ============ */
const SUPABASE_URL = "";      // e.g. "https://abcdxyz.supabase.co"
const SUPABASE_ANON_KEY = ""; // the "anon public" key from Supabase > Project settings > API
/* ======================================================================= */

const KEY = "jotter.v1", CFG_KEY = "jotter.cfg";
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
let S, view = "today", viewDate = iso(new Date()), curSubject = null, openKey = null, disruptOpen = false;

/* ---------- dates ---------- */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function dow(d){return (d.getDay()+6)%7}
function mondayOf(d){return addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-dow(d))}
function short(d){return DAYS[dow(d)].slice(0,3)+" "+d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3)}
function holidayOn(ds){return S.holidays.find(h=>h.from&&h.to&&ds>=h.from&&ds<=h.to)}
function isSchoolDay(d){return dow(d)<5 && !holidayOn(iso(d))}
function todayISO(){return iso(new Date())}

/* ---------- state ---------- */
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function subj(id){return S.subjects.find(s=>s.id===id)}
function subjectAt(pid,di){return S.grid[pid+"|"+di]||""}
function lk(ds,pid){return ds+"|"+pid}
function hueOf(id){const s=subj(id);return s?s.hue:210}
function chip(id){const s=subj(id);return s?`<span class="chip" style="--h:${s.hue}">${esc(s.name)}</span>`:`<span class="chip none">Free</span>`}

function defaultState(){
  const subjects=[
    ["lit","Literacy",212],["mat","Numeracy & maths",140],["spl","Spelling & handwriting",268],
    ["idl","IDL topic",28],["pe","PE",2],["sci","Science",182],["art","Expressive arts",320],
    ["fr","French",236],["rme","RME",48],["hwb","Health & wellbeing",96],["ass","Assembly",200]
  ].map(([id,name,hue])=>({id,name,hue}));
  const periods=[
    {id:"reg",label:"Register & soft start",start:"09:00",end:"09:15",kind:"break"},
    {id:"m1",label:"Morning 1",start:"09:15",end:"10:30",kind:"lesson"},
    {id:"brk",label:"Break",start:"10:30",end:"10:45",kind:"break"},
    {id:"m2",label:"Morning 2",start:"10:45",end:"11:45",kind:"lesson"},
    {id:"m3",label:"Morning 3",start:"11:45",end:"12:15",kind:"lesson"},
    {id:"lun",label:"Lunch",start:"12:15",end:"13:00",kind:"break"},
    {id:"a1",label:"Afternoon 1",start:"13:00",end:"14:00",kind:"lesson"},
    {id:"a2",label:"Afternoon 2",start:"14:00",end:"15:00",kind:"lesson"}
  ];
  const g={};
  const rows={m1:["lit","lit","lit","lit","lit"],m2:["mat","mat","mat","mat","mat"],m3:["spl","spl","spl","spl","hwb"],a1:["idl","pe","sci","art","idl"],a2:["fr","rme","idl","pe","ass"]};
  for(const pid in rows) rows[pid].forEach((s,i)=>g[pid+"|"+i]=s);
  return {v:1,subjects,periods,grid:g,lessons:{},
    holidays:[{id:uid(),name:"October week (example: change to your school's dates)",from:"2026-10-12",to:"2026-10-16"}],
    examples:true,fresh:true,updated:Date.now()};
}
function migrate(x){
  const d=defaultState();
  if(!x||typeof x!=="object") return d;
  for(const k of ["subjects","periods","grid","lessons","holidays"]) if(!x[k]) x[k]=d[k];
  return x;
}
function seedExamples(){
  const seqs={
    mat:{eo:"MNU 1-03a",list:[
      ["Adding 2-digit numbers mentally","We are learning to add two 2-digit numbers in our heads.","I can partition both numbers into tens and ones.\nI can explain my strategy to a partner.","Number talk warm-up (5 min): 34 + 25.\nModel partitioning on the class number line.\nPairs: roll two 2-digit numbers and add them, record strategy.\nPlenary: two pairs share different strategies.","Support: 100 square and tens/ones cubes.\nChallenge: add three 2-digit numbers."],
      ["Bridging through 10","We are learning to add by making the next ten.","I can find the number that makes the next ten.\nI can split the second number to bridge.","Quick fire: number bonds to 10.\nModel 38 + 7 as 38 + 2 + 5 on an empty number line.\nGroup task cards.","Support: bead strings.\nChallenge: bridge through 100."],
      ["Adding near doubles","We are learning to use doubles to add.","I can spot near doubles.\nI can say which double helps me.","Doubles bingo.\nSort sums into near doubles / not.\nWrite own near-double sums for a partner.",""],
      ["Subtracting by counting on","We are learning to find the difference by counting on.","I can count on from the smaller number.\nI can show the jumps on a number line.","","" ],
      ["Finding the difference on a number line","","","",""],
      ["Word problems: at the shop","","","",""],
      ["Check-in: addition and subtraction","","","",""]]},
    lit:{eo:"LIT 1-26a, ENG 1-27a",list:[
      ["Persuasive letters: what makes a letter persuasive?","We are learning to recognise persuasive writing.","I can find persuasive words in a letter.\nI can say who the letter is trying to persuade.","Read the letter from the class novel together.\nHighlight persuasive words in pairs.\nBuild a class word wall.","Support: word bank with pictures.\nChallenge: rank the reasons from strongest to weakest."],
      ["Facts and opinions","We are learning to tell a fact from an opinion.","I can sort sentences into fact or opinion.\nI can write one of each.","Fact or opinion stand-up game.\nSorting cards in groups.",""],
      ["Planning my letter to the head teacher","We are learning to plan a persuasive letter.","I can choose three reasons.\nI can add a because to each reason.","Shared planning frame on the board.\nIndependent plan.",""],
      ["Drafting: opening paragraph","","","",""],
      ["Drafting: three reasons with because","","","",""],
      ["Editing with a partner","","","",""]]},

/* ---------- slots & push-down ---------- */
function subjectSlots(sid,fromDate,fromIdx,days=366){
  const out=[];let d=parseISO(fromDate);
  for(let i=0;i<days;i++){
    if(isSchoolDay(d)){
      const ds=iso(d),di=dow(d);
      S.periods.forEach((p,pi)=>{
        if(p.kind!=="lesson")return;
        if(i===0&&pi<fromIdx)return;
        if(subjectAt(p.id,di)===sid) out.push(lk(ds,p.id));
      });
    }
    d=addDays(d,1);
  }
  return out;
}
/* Every lesson not yet taught, from this slot on, slides down one slot of the same subject.
   Taught lessons stay exactly where they are. */
function pushDown(sid,ds,pi){
  const slots=subjectSlots(sid,ds,pi).filter(k=>!(S.lessons[k]&&S.lessons[k].taught));
  const queue=slots.map(k=>S.lessons[k]||null);
  let last=queue.length-1;while(last>=0&&!queue[last])last--;
  if(last<0)return 0;
  slots.forEach(k=>delete S.lessons[k]);
  let moved=0;
  for(let i=0;i<=last;i++){
    if(!queue[i])continue;
    const t=slots[i+1]?i+1:i; // no later slot within a year: leave it where it was
    S.lessons[slots[t]]=queue[i];moved++;
  }
  return moved;
}
function periodIdx(pid){return S.periods.findIndex(p=>p.id===pid)}
function nextSlotOf(key){
  const [ds,pid]=key.split("|");const d=parseISO(ds);const sid=subjectAt(pid,dow(d));
  const list=subjectSlots(sid,ds,periodIdx(pid)+1);
  return list.find(k=>!S.lessons[k]) || null;
}
function isNow(ds,p){
  if(ds!==todayISO())return false;
  const n=new Date(),m=n.getHours()*60+n.getMinutes();
  const toM=t=>{const [h,mm]=(t||"0:0").split(":").map(Number);return h*60+mm};
  return m>=toM(p.start)&&m<toM(p.end);
}

    case "add-h":S.holidays.push({id:uid(),name:"Holiday",from:"",to:""});commit();render();break;
    case "del-h":S.holidays.splice(+b.dataset.i,1);commit();render();break;
    case "export":{const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a2=document.createElement("a");a2.href=URL.createObjectURL(blob);a2.download="jotter-backup-"+todayISO()+".json";document.body.appendChild(a2);a2.click();a2.remove();break}
    case "save-cfg":saveCfg();break;
    case "signin":auth("in");break;
    case "signup":auth("up");break;
    case "signout":sb&&sb.auth.signOut().then(()=>{session=null;render()});break;
    case "sync-now":pull();break;
  }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.ed&&openKey){
    const L=S.lessons[openKey]||(S.lessons[openKey]={});
    L[el.dataset.ed]=el.type==="checkbox"?el.checked:el.value;
    if(L.ex)L.ex=false;
    if(el.dataset.ed==="res")$("#ed-links").innerHTML=linksHTML(el.value);
    commit();
  }
  if(el.dataset.set==="s"&&el.dataset.f==="hue"){S.subjects[+el.dataset.i].hue=+el.value;const c=el.nextElementSibling;if(c)c.style.setProperty("--h",el.value)}
});
document.addEventListener("change",e=>{
  const el=e.target,t=el.dataset.set;if(!t)return;
  if(t==="p"){S.periods[+el.dataset.i][el.dataset.f]=el.value}
  else if(t==="g"){if(el.value)S.grid[el.dataset.k]=el.value;else delete S.grid[el.dataset.k]}
  else if(t==="s"){const s=S.subjects[+el.dataset.i];s[el.dataset.f]=el.dataset.f==="hue"?+el.value:el.value}
  else if(t==="h"){S.holidays[+el.dataset.i][el.dataset.f]=el.value}
  commit();if(t==="p"&&el.dataset.f==="kind"||t==="s")render();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&openKey)closeSheet()});
setInterval(()=>{if(view==="today"&&!openKey&&!disruptOpen)render()},60000);

/* ---------- sync (Supabase) ---------- */
let sb=null,session=null,syncState="local",syncMsg="",lastSync=null,pushT=null;
function getCfg(){let c={};try{c=JSON.parse(localStorage.getItem(CFG_KEY)||"{}")}catch(e){}return {url:SUPABASE_URL||c.url||"",key:SUPABASE_ANON_KEY||c.key||""}}
function saveCfg(){const url=$("#cfg-url").value.trim(),key=$("#cfg-key").value.trim();try{localStorage.setItem(CFG_KEY,JSON.stringify({url,key}))}catch(e){}initSync()}
function setSync(s,m){syncState=s;syncMsg=m||"";if(s==="ok")lastSync=new Date();renderSyncChip()}
function renderSyncChip(){
  const el=$("#sync");if(!el)return;el.dataset.s=syncState;
  const t=lastSync?String(lastSync.getHours()).padStart(2,"0")+":"+String(lastSync.getMinutes()).padStart(2,"0"):"";
  el.querySelector("span").textContent={local:"Saved on this device",signedout:"Sign in to sync",syncing:"Syncing…",ok:"Synced "+t,offline:"Offline, will sync later",error:"Sync problem"}[syncState]||"";
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function initSync(){
  const c=getCfg();if(!c.url||!c.key){setSync("local");if(view==="setup")render();return}
  try{
    if(!window.supabase)await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js");
    sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});
    const {data}=await sb.auth.getSession();session=data.session;
    sb.auth.onAuthStateChange((_e,s)=>{const was=!!session;session=s;if(s&&!was)pull();if(!s)setSync("signedout");if(view==="setup")render()});
    if(session)await pull();else setSync("signedout");
  }catch(e){setSync(navigator.onLine?"error":"offline",e.message||String(e))}
  if(view==="setup")render();
}
async function pull(){
  if(!sb||!session)return;
  if(!navigator.onLine){setSync("offline");return}
  setSync("syncing");
  try{
    const {data,error}=await sb.from("planner").select("data,updated_at").eq("user_id",session.user.id).maybeSingle();
    if(error)throw error;
    if(!data){await push();return}
    const rt=Date.parse(data.updated_at);
    if(S.fresh||rt>(S.updated||0)){ // remote is newer, or this device has never been edited
      S=migrate(data.data);S.updated=rt;S.fresh=false;saveLocal();if(!openKey)render();setSync("ok");
    }else if((S.updated||0)>rt){await push()}
    else setSync("ok");
  }catch(e){setSync("error",e.message||String(e))}
}
async function push(){
  if(!sb||!session)return;
  if(!navigator.onLine){setSync("offline");return}
  setSync("syncing");
  try{
    const {error}=await sb.from("planner").upsert({user_id:session.user.id,data:S,updated_at:new Date(S.updated).toISOString()});
    if(error)throw error;setSync("ok");
  }catch(e){setSync("error",e.message||String(e))}
}
function schedulePush(){if(!sb||!session)return;clearTimeout(pushT);pushT=setTimeout(push,1500)}
async function auth(mode){
  const email=$("#au-email").value.trim(),password=$("#au-pass").value;
  if(!email||password.length<6){toast("Enter an email and a password of 6+ characters");return}
  setSync("syncing");
  const r=mode==="in"?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
  if(r.error){setSync("error",r.error.message);toast(r.error.message);render();return}
  if(mode==="up"&&!r.data.session){setSync("signedout");toast("Check your email to confirm, then sign in");render();return}
  toast("Signed in");
}
function renderSyncSetup(){
  const c=getCfg();
  let inner;
  if(!c.url||!c.key){
    inner=`<p class="note">Right now everything is saved on this device only. To use the planner on her iPad and a laptop, connect a free Supabase project (Craig: see the README).</p>
    <div class="grid2"><label><span class="label">Project URL</span><input type="url" id="cfg-url" placeholder="https://xxxx.supabase.co"></label>
    <label><span class="label">Anon public key</span><input type="text" id="cfg-key" placeholder="eyJhbGciOi…"></label></div>
    <div><button class="btn" data-act="save-cfg">Connect</button></div>`;
  }else if(!session){
    inner=`<p class="note">Sign in with the same email on every device and the planner stays the same on all of them.</p>
    <div class="grid2"><label><span class="label">Email</span><input type="email" id="au-email" autocomplete="username"></label>
    <label><span class="label">Password</span><input type="password" id="au-pass" autocomplete="current-password"></label></div>
    <div class="row"><button class="btn primary" data-act="signin">Sign in</button><button class="btn" data-act="signup">Create account</button></div>`;
  }else{
    inner=`<p class="note">Signed in as <b>${esc(session.user.email)}</b>. Changes sync a moment after you make them, and wait if you're offline.</p>
    <div class="row"><button class="btn" data-act="sync-now">Sync now</button><button class="btn ghost danger" data-act="signout">Sign out</button></div>`;
  }
  return `<section><h2>Sync between devices</h2>${inner}${syncState==="error"&&syncMsg?`<p class="note" style="color:var(--warn)">Last sync failed: ${esc(syncMsg)}</p>`:""}</section>`;
}
window.addEventListener("online",()=>{if(session)pull()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&session&&!openKey)pull()});

/* ---------- start ---------- */
load();render();initSync();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
